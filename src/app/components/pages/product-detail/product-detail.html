<section class="product-detail">
  <div class="product-detail__gallery">
    <div class="product-detail__media">
      <img [src]="'/images/products/' + product.image" [alt]="product.name" />
    </div>
    <div class="product-detail__thumbs" *ngIf="product.images && product.images.length > 0">
      <button class="product-detail__thumb" type="button" *ngFor="let img of product.images; let i = index"
        [attr.aria-label]="'Vista alternativa ' + (i + 1)" (click)="product.image = img">
        <img [src]="'/images/products/' + img" [alt]="product.name" />
      </button>
    </div>
  </div>
  <div class="product-detail__content">
    <h1 class="product-detail__title">{{ product.name }}</h1>
    <p class="product-detail__price">{{ product.price }}€</p>
    <p class="product-detail__description">
      {{ product.description }}
    </p>
    <ul class="product-detail__benefits">
      <li class="product-detail__benefit">
        <span class="product-detail__benefit-icon" aria-hidden="true">
          <img src="/icons/entrega.png" alt="" />
        </span>
        Envio gratis
      </li>
      <li class="product-detail__benefit">
        <span class="product-detail__benefit-icon" aria-hidden="true">
          <img src="/icons/devolucion.png" alt="" />
        </span>
        Garantia de devolucion de 30 dias
      </li>
      <li class="product-detail__benefit">
        <span class="product-detail__benefit-icon" aria-hidden="true">
          <img src="/icons/garantia.png" alt="" />
        </span>
        1 año de garantia
      </li>
    </ul>
    <button class="product-detail__cta" type="button">
      <img class="product-detail__cta-icon" src="/icons/add-to-cart.png" alt="" aria-hidden="true" />
      Añadir a la cesta
    </button>
  </div>
</section>

<section class="product-recommended" *ngIf="relatedProducts.length">
  <h3 class="product-recommended__title">Productos relacionados</h3>
  <div class="product-recommended__grid">
    <article class="product-recommended__card" *ngFor="let related of relatedProducts">
      <div class="product-recommended__media">
        <img [src]="'/images/products/' + related.image" [alt]="related.name" />
      </div>
      <div class="product-recommended__body">
        <p class="product-recommended__eyebrow">
          {{ related.category?.[0]?.name || 'Sin categoria' }}
        </p>
        <h4 class="product-recommended__name">{{ related.name }}</h4>
        <p class="product-recommended__price">{{ related.price }}€</p>
      </div>
    </article>
  </div>
</section>
