<section class="product-list">
    <header class="product-list__hero">
        <div class="product-list__hero-content">
            <span class="product-list__chip">{{ categoryChip }}</span>
            <h2 class="product-list__title">{{ categoryTitle }}</h2>
            <p class="product-list__subtitle">{{ categorySubtitle }}</p>
        </div>
        <div class="product-list__hero-meta">
            <div class="product-list__stat">
                <span class="product-list__stat-value">{{ filteredTotal }}</span>
                <span class="product-list__stat-label">Productos disponibles</span>
            </div>
        </div>
    </header>
        <div class="product-grid">
        <app-product-card *ngFor="let product of products" [product]="product"
            class="product-card-wrapper"></app-product-card>
    </div>
</section>
<div class="product-pagination" [class.product-pagination--hidden]="totalPages <= 1">
    <c-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [size]="pageSize"
        [route]="paginationRoute">
    </c-pagination>
</div>
<app-layout-footer></app-layout-footer>
