<section class="c-product-list">
    <header class="c-product-list__hero">
        <div class="c-product-list__hero-content">
            <span class="c-product-list__chip">{{ categoryChip }}</span>
            <h2 class="c-product-list__title">{{ categoryTitle }}</h2>
            <p class="c-product-list__subtitle">{{ categorySubtitle }}</p>
        </div>
        <div class="c-product-list__hero-meta">
            <div class="c-product-list__stat">
                <span class="c-product-list__stat-value">{{ filteredTotal }}</span>
                <span class="c-product-list__stat-label">Productos disponibles</span>
            </div>
        </div>
    </header>

    @if (shouldShowFilters) {
        <app-room-filters (filterChange)="onFilterChange($event)"></app-room-filters>
    }

    <div class="c-product-grid">
        @for (product of products; track product.id) {
        <app-product-card [product]="product" class="c-product-card-wrapper"></app-product-card>
        }
    </div>
</section>
<div class="c-product-pagination" [class.c-product-pagination--hidden]="totalPages <= 1">
    <c-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [size]="pageSize"
        [route]="paginationRoute">
    </c-pagination>
</div>
<app-layout-footer></app-layout-footer>
