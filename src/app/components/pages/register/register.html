<div class="login-container">
    <div class="form">
        <form class="form__card" (ngSubmit)="register()">
            <h2 class="form__title">Regístrate</h2>

            <div class="form-group">
                <label for="name" class="form__label">Nombre</label>
                <input type="text" id="name" class="form__input" placeholder="Ingresa tu nombre" [(ngModel)]="name"
                    name="name" required>
            </div>

            <div class="form-group">
                <label for="email" class="form__label">Correo electrónico</label>
                <input type="email" id="email" class="form__input" placeholder="Ingresa tu correo" [(ngModel)]="email"
                    name="email" required>
            </div>

            <div class="form-group">
                <label for="address" class="form__label">Dirección</label>
                <input type="text" id="address" class="form__input" placeholder="Ingresa tu dirección"
                    [(ngModel)]="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="phone" class="form__label">Teléfono</label>
                <input type="tel" id="phone" class="form__input" placeholder="Ingresa tu teléfono" [(ngModel)]="phone"
                    name="phone" required>
            </div>

            <div class="form-group">
                <label for="password" class="form__label">Contraseña</label>
                <input type="password" id="password" class="form__input" placeholder="Crea una contraseña"
                    [(ngModel)]="password" name="password" required>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" class="form__button">Registrarse</button>

            <div class="form-footer">
                <span>¿Ya tienes cuenta? </span>
                <a routerLink="/login" class="form-link">Inicia sesión</a>
            </div>
        </form>
    </div>
</div>
