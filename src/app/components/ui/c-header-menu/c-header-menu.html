<div class="layout-header__categories" [class.is-open]="open" [attr.aria-hidden]="!open"
  [attr.id]="menuId" [style.--menu-padding-top]="paddingTop" [style.--menu-padding-bottom]="paddingBottom"
  [style.--menu-item-padding]="itemPadding">
  <div class="layout-header__categories-inner">
    @for (item of items; track item.label) {
    <button class="layout-header__category-link" type="button" (click)="onItemClick(item, $event)">
      {{ item.label }}
    </button>
    }
  </div>
</div>
