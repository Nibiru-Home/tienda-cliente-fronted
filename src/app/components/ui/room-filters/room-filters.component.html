<div class="c-filters-container">
    <div class="c-filter-group">
        <button class="c-filter-pill" [class.g--active]="selectedStyle" [class.g--open]="openDropdown === 'style'"
            (click)="toggleDropdown('style', $event)">
            {{ selectedStyle || 'Estilo' }}
            <span class="c-chevron">▼</span>
        </button>

        @if (openDropdown === 'style') {
        <div class="c-dropdown-menu">
            <button class="c-dropdown-item" [class.g--selected]="!selectedStyle" (click)="selectStyle('')">
                Cualquiera
            </button>
            @for (style of styles; track style) {
            <button class="c-dropdown-item" [class.g--selected]="selectedStyle === style" (click)="selectStyle(style)">
                {{ style }}
            </button>
            }
        </div>
        }
    </div>

    <div class="c-filter-group">
        <button class="c-filter-pill" [class.g--active]="selectedBudget" [class.g--open]="openDropdown === 'budget'"
            (click)="toggleDropdown('budget', $event)">
            {{ getBudgetLabel(selectedBudget) || 'Presupuesto' }}
            <span class="c-chevron">▼</span>
        </button>

        @if (openDropdown === 'budget') {
        <div class="c-dropdown-menu">
            <button class="c-dropdown-item" [class.g--selected]="!selectedBudget" (click)="selectBudget('')">
                Cualquiera
            </button>
            @for (option of budgetOptions; track option.value) {
            <button class="c-dropdown-item" [class.g--selected]="selectedBudget === option.value"
                (click)="selectBudget(option.value)">
                {{ option.label }}
            </button>
            }
        </div>
        }
    </div>

    <div class="c-filter-group">
        <button class="c-filter-pill" [class.g--active]="selectedCategory" [class.g--open]="openDropdown === 'category'"
            (click)="toggleDropdown('category', $event)">
            {{ selectedCategory || 'Categoría' }}
            <span class="c-chevron">▼</span>
        </button>

        @if (openDropdown === 'category') {
        <div class="c-dropdown-menu">
            <button class="c-dropdown-item" [class.g--selected]="!selectedCategory" (click)="selectCategory('')">
                Cualquiera
            </button>
            @for (cat of categories; track cat) {
            <button class="c-dropdown-item" [class.g--selected]="selectedCategory === cat" (click)="selectCategory(cat)">
                {{ cat }}
            </button>
            }
        </div>
        }
    </div>

    @if (openDropdown) {
    <div class="c-backdrop" (click)="closeDropdown()"></div>
    }
</div>
