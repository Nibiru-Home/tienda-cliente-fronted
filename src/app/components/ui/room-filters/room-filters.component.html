<div class="filters-container">
    <!-- Style Filter -->
    <div class="filter-group">
        <button class="filter-pill" [class.active]="selectedStyle" [class.open]="openDropdown === 'style'"
            (click)="toggleDropdown('style', $event)">
            {{ selectedStyle || 'Estilo' }}
            <span class="chevron">▼</span>
        </button>

        @if (openDropdown === 'style') {
        <div class="dropdown-menu">
            <button class="dropdown-item" [class.selected]="!selectedStyle" (click)="selectStyle('')">
                Cualquiera
            </button>
            @for (style of styles; track style) {
            <button class="dropdown-item" [class.selected]="selectedStyle === style" (click)="selectStyle(style)">
                {{ style }}
            </button>
            }
        </div>
        }
    </div>

    <!-- Budget Filter -->
    <div class="filter-group">
        <button class="filter-pill" [class.active]="selectedBudget" [class.open]="openDropdown === 'budget'"
            (click)="toggleDropdown('budget', $event)">
            {{ getBudgetLabel(selectedBudget) || 'Presupuesto' }}
            <span class="chevron">▼</span>
        </button>

        @if (openDropdown === 'budget') {
        <div class="dropdown-menu">
            <button class="dropdown-item" [class.selected]="!selectedBudget" (click)="selectBudget('')">
                Cualquiera
            </button>
            @for (option of budgetOptions; track option.value) {
            <button class="dropdown-item" [class.selected]="selectedBudget === option.value"
                (click)="selectBudget(option.value)">
                {{ option.label }}
            </button>
            }
        </div>
        }
    </div>

    <!-- Category Filter -->
    <div class="filter-group">
        <button class="filter-pill" [class.active]="selectedCategory" [class.open]="openDropdown === 'category'"
            (click)="toggleDropdown('category', $event)">
            {{ selectedCategory || 'Categoría' }}
            <span class="chevron">▼</span>
        </button>

        @if (openDropdown === 'category') {
        <div class="dropdown-menu">
            <button class="dropdown-item" [class.selected]="!selectedCategory" (click)="selectCategory('')">
                Cualquiera
            </button>
            @for (cat of categories; track cat) {
            <button class="dropdown-item" [class.selected]="selectedCategory === cat" (click)="selectCategory(cat)">
                {{ cat }}
            </button>
            }
        </div>
        }
    </div>

    <!-- Backdrop to close dropdowns when clicking outside -->
    @if (openDropdown) {
    <div class="backdrop" (click)="closeDropdown()"></div>
    }
</div>
