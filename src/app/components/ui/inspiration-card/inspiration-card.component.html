<a class="inspiration-card" [attr.href]="href">
  <div class="inspiration-card__media">
    <img [src]="imageSrc" [attr.alt]="alt || title" loading="lazy" />
  </div>
  <div class="inspiration-card__body">
    <h4 class="inspiration-card__title">{{ title }}</h4>
    <p class="inspiration-card__text">{{ description }}</p>
  </div>
</a>
